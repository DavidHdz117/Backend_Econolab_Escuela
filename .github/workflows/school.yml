name: School administration CI
on:
  push:
    branches: [main, feature/school-administration]
    paths: ['src/school/**', 'src/app.module.ts', 'scripts/school-smoke.cjs', '.github/workflows/school.yml']
  pull_request:
    branches: [main]
    paths: ['src/school/**', 'src/app.module.ts', 'scripts/school-smoke.cjs', '.github/workflows/school.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: econolab_school_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/eslint/bin/eslint.js src/school --max-warnings 0
      - run: npm test -- --ci --runInBand school.spec.ts
      - run: npm run build
      - name: Real HTTP, JWT and PostgreSQL tests
        env:
          SCHOOL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/econolab_school_test
        run: node scripts/school-smoke.cjs

