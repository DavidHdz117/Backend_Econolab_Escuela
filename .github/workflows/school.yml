name: School administration CI
on:
  push:
    branches: [main, feature/school-administration]
    paths: ['src/school/**', 'src/app.module.ts', 'scripts/school-smoke.cjs', '.github/workflows/school.yml']
  pull_request:
    branches: [main]
    paths: ['src/school/**', 'src/app.module.ts', 'scripts/school-smoke.cjs', '.github/workflows/school.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Start isolated PostgreSQL with an ephemeral credential
        shell: bash
        run: |
          school_db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$school_db_password"
          echo "SCHOOL_TEST_DATABASE_URL=postgresql://postgres:$school_db_password@127.0.0.1:5432/econolab_school_test" >> "$GITHUB_ENV"
          docker run --detach --name school-postgres --publish 127.0.0.1:5432:5432 --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD="$school_db_password" --env POSTGRES_DB=econolab_school_test postgres:17
          for attempt in $(seq 1 30); do
            if docker exec school-postgres pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci --ignore-scripts
      - run: node node_modules/eslint/bin/eslint.js src/school --max-warnings 0
      - run: npm test -- --ci --runInBand school.spec.ts
      - run: npm run build
      - name: Real HTTP, JWT and PostgreSQL tests
        run: node scripts/school-smoke.cjs
      - name: Stop fixture database
        if: always()
        run: docker rm --force school-postgres
